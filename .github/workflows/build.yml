name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Unit Test (Ubuntu devel / DTK6)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            g++ \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-tools-dev \
            libdtk6core-dev \
            libdtk6gui-dev \
            libdtk6widget-dev \
            libdtk6log-dev \
            libpolkit-qt6-1-dev \
            libgtest-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          cd build
          ctest --output-on-failure

      - name: Report tray status
        # dde-tray-loader SDK (dde-dock) is a deepin/UOS component not shipped in
        # Ubuntu, so the tray plugin is intentionally skipped on this generic CI.
        # It is built only in the deepin-based packaging job.
        run: |
          if [ -f build/plugins/libdtk-update-tray.so ]; then
            echo "tray plugin: built"
          else
            echo "tray plugin: skipped (dde-dock SDK unavailable on ubuntu:devel; built in packaging job)"
          fi
