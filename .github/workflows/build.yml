name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 多架构策略：
# - amd64   : GitHub 原生 x86_64 runner (ubuntu-24.04)，debootstrap 同架构 beige rootfs
# - arm64   : GitHub 原生 ARM runner (ubuntu-24.04-arm64)，debootstrap 同架构 beige rootfs
# - loong64 : GitHub 无原生 runner、Ubuntu 也无 loong64 port，
#            故在 x86_64 runner 上用 qemu-user-static 模拟 loongarch64 执行 chroot
# 三架构统一使用 deepin beige 源 (DTK6 dev 包三架构均可用)，保证产物环境一致。
# 直接产出 .deb 产物（非 zip）。

jobs:
  build-deb:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm64
          - arch: loong64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .deb in deepin beige rootfs
        run: bash ci/multiarch-build.sh ${{ matrix.arch }} "$PWD"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtk-update-${{ matrix.arch }}
          path: artifacts/dtk-update*.deb
          if-no-files-found: error
