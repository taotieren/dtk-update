name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 说明：
# - DTK6 官方 dev 包（libdtk6core/gui/widget/declarative-dev）仅在 Ubuntu 开发版
#   （ubuntu:devel，对应 stonking 套件）提供，LTS(24.04/26.04) 与 25.10 均缺 widget/declarative。
#   故构建容器统一使用 ubuntu:devel。
# - Ubuntu 官方源无任何 DTK5 包（libdtk5* 不存在），DTK5/Qt5 兼容验证依赖 deepin
#   私有环境，无法在纯 Ubuntu CI 中构建，故此处仅保留 DTK6 矩阵。

jobs:
  # 主构建：DTK6 / Qt6，产出 .deb 产物
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake debhelper-compat pkg-config \
            qt6-base-dev qt6-tools-dev \
            libdtk6core-dev libdtk6gui-dev libdtk6widget-dev \
            libgtest-dev libpolkit-qt6-1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure || true

      - name: Package deb
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtk-update-deb
          path: ../*.deb
