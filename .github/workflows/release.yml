name: release

# 仅在推送 tag（形如 v1.2.3 或 1.2.3）时触发，为 x86_64/arm64/loong64
# 三架构构建 .deb 并汇总上传到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm64
          - arch: loong64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building release $VER (tag $TAG)"

      - name: Stamp changelog
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DATE=$(date -R)
          {
            echo "dtk-update ($VER) unstable; urgency=medium"
            echo ""
            echo "  * Release $VER"
            echo ""
            echo " -- dtk-update Maintainers <maintainer@example.com>  $DATE"
            echo ""
            cat debian/changelog
          } > debian/changelog.tmp && mv debian/changelog.tmp debian/changelog

      - name: Build .deb in deepin beige rootfs
        run: bash ci/multiarch-build.sh ${{ matrix.arch }} "$PWD"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtk-update-${{ matrix.arch }}
          path: artifacts/dtk-update*.deb
          if-no-files-found: error

  publish:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all architecture debs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -1 release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dtk-update ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/dtk-update*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
