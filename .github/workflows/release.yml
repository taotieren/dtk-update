name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }} / DTK6)
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:devel
    strategy:
      fail-fast: false
      matrix:
        # amd64 / arm64 在对应原生 runner 上直接构建（Ubuntu 提供 DTK6 开发栈）。
        # loong64 在纯 Ubuntu 环境缺少 DTK6 包与官方 runner，标记为 best-effort，
        # 失败不阻塞其余架构的发布。
        include:
          - arch: amd64
            runner: ubuntu-24.04
            best-effort: false
          - arch: arm64
            runner: ubuntu-24.04-arm64
            best-effort: false
          - arch: loong64
            runner: ubuntu-24.04
            best-effort: true
    continue-on-error: ${{ matrix.best-effort }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .deb
        run: bash ci/multiarch-build.sh deb ${{ matrix.arch }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dtk-update-deb-${{ matrix.arch }}
          path: |
            ../dtk-update_*.deb
            ../dtk-update_*.changes
            ../dtk-update_*.buildinfo
          if-no-files-found: warn

  release:
    name: Draft Release
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dtk-update-deb-*
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f -name '*.deb' -exec ls -l {} \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/dtk-update_*.deb
          draft: true
          generate_release_notes: true
