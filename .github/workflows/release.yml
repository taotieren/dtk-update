name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (Ubuntu devel / DTK6)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            g++ \
            extra-cmake-modules \
            debhelper-compat \
            dpkg-dev \
            qt6-base-dev \
            qt6-tools-dev \
            libdtk6core-dev \
            libdtk6gui-dev \
            libdtk6widget-dev \
            libdtk6log-dev \
            libpolkit-qt6-1-dev \
            libgtest-dev \
            devscripts

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtk-update-deb
          path: |
            ../dtk-update_*.deb
            ../dtk-update_*.changes
            ../dtk-update_*.buildinfo

  release:
    name: Draft Release
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dtk-update-deb
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dtk-update_*.deb
          draft: true
          generate_release_notes: true
