name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 多架构单元测试：amd64 / arm64 走原生 runner（Ubuntu 提供 DTK6 开发栈）。
# 直接在 ubuntu:devel 容器内安装 DTK6 依赖并原生跑 cmake + ctest，
# 不再依赖已删除的 ci/multiarch-build.sh。
# loong64 不在此矩阵：ubuntu:devel 容器没有 loong64 的 DTK6 开发包，
# 在该环境必然构建失败。loong64 的构建/打包由其专属方案负责——
# .github/workflows/build.yml 用 debootstrap deepin beige rootfs + chroot
# （loong64 经 qemu 用户态模拟）产出 .deb，不走本测试容器。
jobs:
  unit-test:
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install DTK6 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ extra-cmake-modules \
            qt6-base-dev qt6-tools-dev \
            libdtk6core-dev libdtk6gui-dev libdtk6widget-dev libdtk6log-dev \
            libpolkit-qt6-1-dev libgtest-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
