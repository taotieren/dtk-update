name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 多架构单元测试：amd64/arm64 走原生 runner，loong64 走 QEMU 模拟，
# 均在 deepin beige rootfs 中编译并运行 ctest。
jobs:
  unit-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm64
          - arch: loong64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build & run tests in deepin beige rootfs
        run: bash ci/multiarch-build.sh test ${{ matrix.arch }} "$PWD"
